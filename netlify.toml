# Unbolt — Netlify configuration
# The Next.js runtime is auto-detected; no plugin declaration required.
# Secrets are NEVER stored here. They live in Netlify env vars, scoped per context.

[build]
  # Just the build. Netlify applies the migrations itself.
  #
  # ── The correction ────────────────────────────────────────────────
  # In M8 I concluded that nothing applied migrations on deploy, because
  # @netlify/database is a connection helper with no migration code and no
  # build plugin is declared here. I looked in the repository and found
  # nothing, and stopped there.
  #
  # It is a PLATFORM step, invisible from inside the repo. The first real build
  # log shows it, before the build command runs:
  #
  #   Netlify Database setup
  #   Loading migrations from netlify/database/migrations directory:
  #    - 20260816000001_identity_and_tenancy
  #    … all eleven …
  #
  # Adding `npm run db:migrate &&` here then failed the build outright, because
  # NETLIFY_DATABASE_URL is injected into FUNCTIONS at runtime and is not in the
  # build environment — the resolved config lists only NODE_VERSION,
  # NEXT_TELEMETRY_DISABLED and the two NEXT_PUBLIC_ values.
  #
  # So the runner stays as a local and manual tool (`npm run db:migrate`), which
  # is where it earns its place: applying the schema to a fresh database from a
  # laptop, which the platform step cannot do for you.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# ── Deploy contexts ────────────────────────────────────────────────
[context.production.environment]
  NEXT_PUBLIC_APP_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://unbolt.unboundsolutions.in"

[context.deploy-preview.environment]
  NEXT_PUBLIC_APP_ENV = "preview"

[context.branch-deploy.environment]
  NEXT_PUBLIC_APP_ENV = "staging"

# ── Functions ─────────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# The scan worker exceeds the 10s synchronous limit, so it is a
# background function (suffix `-background`, up to 15 minutes).
[functions."scan-worker-background"]
  included_files = ["netlify/database/**"]

# A background function cannot also be scheduled, so a small scheduled
# function invokes it. This is what makes the best-effort kick from
# POST /api/scans safe to be best-effort: work that the kick misses,
# or whose lease expired, is still picked up.
[functions."scan-sweeper"]
  schedule = "*/2 * * * *"

# Drains the notification outbox written by the task engine (M4).
[functions."notify-worker"]
  schedule = "* * * * *"

# ── Security headers (applied site-wide) ──────────────────────────
# CSP is emitted per-request with a nonce from middleware; the static
# headers below are the non-nonce baseline.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "on"

# Self-hosted fonts are immutable and safe to cache hard.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never let an authenticated surface be cached by an intermediary.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

# ── Redirects ─────────────────────────────────────────────────────
# Legacy/parent-brand entry points and vanity paths.
[[redirects]]
  from = "/dashboard"
  to = "/app"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/register"
  status = 301

[[redirects]]
  from = "/scan"
  to = "/tools/store-health-scan"
  status = 301

# Preview/staging deploys are kept out of the index via runtime metadata
# (robots: noindex when NEXT_PUBLIC_APP_ENV !== "production"), not via a
# static header — a static header here would also hit production.
